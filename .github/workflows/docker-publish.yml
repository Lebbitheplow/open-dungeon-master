name: Publish Docker image

# Publishes the single-image install whenever a GitHub release is published.
# Also runnable by hand against any tag or branch, which is the way to retry a
# failed publish without cutting a new release.
#
# GHCR needs no setup: it authenticates with the built-in GITHUB_TOKEN.
#
# Docker Hub is published to as well, but only when both of these repository
# secrets exist. Without them the job still succeeds and publishes to GHCR only.
#   DOCKERHUB_USERNAME  - your Docker ID (not necessarily your GitHub username;
#                         it is shown in the top-right menu on hub.docker.com)
#   DOCKERHUB_TOKEN     - Account settings > Personal access tokens, Read/Write.
#                         Signing in to Docker Hub through GitHub OAuth does not
#                         change this; a token is still how CI authenticates.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the ref name)"
        required: false
        type: string

env:
  DOCKERHUB_IMAGE: lebbi/open-dungeon-master

jobs:
  publish:
    runs-on: ubuntu-latest
    # The build bakes the Open5e pack and the MiniLM model, so it is slower than
    # a plain next build.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Work out which registries are configured
        id: registries
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          # GHCR rejects uppercase in a repository path; the owner may have it.
          images="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            images="$(printf '%s\n%s' "$images" "$DOCKERHUB_IMAGE")"
          else
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; publishing to GHCR only."
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "dockerhub=$HAS_DOCKERHUB" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.registries.outputs.dockerhub == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          # A release tagged v0.10.1 publishes 0.10.1, 0.10 and latest.
          # Pre-releases publish their version but never move latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            # A manual run from a branch has no version to derive; publish :edge
            # rather than failing with no tags at all.
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && !startsWith(github.ref, 'refs/tags/') }}
          flavor: |
            latest=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=Open Dungeon Master
            org.opencontainers.image.description=Self-hosted multiplayer D&D 5e platform with an AI Dungeon Master

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: the image prunes the arm64 onnxruntime binary and traces
          # only linux/x64, and the app is meant to sit beside an x86 GPU host.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          tag=$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -1)
          echo "Pulling and starting $tag"
          docker run -d --name odm-smoke -p 3005:3005 "$tag"
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3005/api/health > /dev/null; then
              echo "Published image answers /api/health."
              docker rm -f odm-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Published image never became healthy."
          docker logs odm-smoke
          docker rm -f odm-smoke
          exit 1
