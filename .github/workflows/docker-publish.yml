name: Publish Docker image

# Publishes the single-image install for every GitHub release, by channel
# (docs/releases.md):
#
#   a beta (a prerelease) builds :0.29.6, and moves :beta when it is the
#     newest release of any kind;
#   a promotion to stable (the prerelease flag cleared) builds nothing: the
#     beta's own image is tagged :latest, :stable and :0.29, so stable users
#     run the bits the beta testers ran;
#   a release published straight as stable, with no beta image to promote,
#     is built with all of those tags.
#
# A failed release run is retried with "Re-run jobs", which replays its
# release event and so its channel. Also runnable by hand against any tag or
# branch, which publishes that version's tag (or :edge) and nothing else.
#
# GHCR needs no setup: it authenticates with the built-in GITHUB_TOKEN.
#
# Docker Hub is published to as well, but only when both of these repository
# secrets exist. Without them the job still succeeds and publishes to GHCR only.
#   DOCKERHUB_USERNAME  - your Docker ID (not necessarily your GitHub username;
#                         it is shown in the top-right menu on hub.docker.com)
#   DOCKERHUB_TOKEN     - Account settings > Personal access tokens, Read/Write.
#                         Signing in to Docker Hub through GitHub OAuth does not
#                         change this; a token is still how CI authenticates.

on:
  release:
    # prereleased: a beta was published. released: a release is stable,
    # published that way or promoted from a beta. Each publish fires exactly
    # one of the two.
    types: [prereleased, released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the ref name)"
        required: false
        type: string

env:
  DOCKERHUB_IMAGE: lebbi/open-dungeon-master

# A beta promoted while its own image is still building waits for that build,
# then finds the image and retags it instead of building it a second time.
concurrency:
  group: docker-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The build bakes the Open5e pack and the MiniLM model, so it is slower than
    # a plain next build.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Work out which registries are configured
        id: registries
        env:
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          # GHCR rejects uppercase in a repository path; the owner may have it.
          images="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            images="$(printf '%s\n%s' "$images" "$DOCKERHUB_IMAGE")"
          else
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; publishing to GHCR only."
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "dockerhub=$HAS_DOCKERHUB" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.registries.outputs.dockerhub == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TAG: ${{ github.event.release.tag_name }}
          IMAGES: ${{ steps.registries.outputs.images }}
        run: |
          if [ "$EVENT" != "release" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "beta=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # :beta is the newest release of either kind. Versions are plain
          # x.y.z, so sort -V orders them; a fix to the stable line published
          # after a newer beta does not take :beta back.
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | sort -V | tail -1)
          echo "beta=$([ "$newest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          mode=build
          if [ "$ACTION" = "released" ]; then
            # Promoted from a beta: its image is in every registry already.
            mode=retag
            while read -r image; do
              if ! docker buildx imagetools inspect "$image:${TAG#v}" > /dev/null 2>&1; then
                echo "::notice::$image:${TAG#v} was never published as a beta; building it."
                mode=build
              fi
            done <<< "$IMAGES"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "$TAG ($ACTION): $mode, newest release $newest"

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          # A beta v0.29.6 publishes 0.29.6 (and beta when it is the newest).
          # The same release made stable adds 0.29, stable and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event.action == 'released' }}
            type=raw,value=stable,enable=${{ github.event.action == 'released' }}
            type=raw,value=beta,enable=${{ steps.channel.outputs.beta == 'true' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            # A manual run from a branch has no version to derive; publish :edge
            # rather than failing with no tags at all.
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && !startsWith(github.ref, 'refs/tags/') }}
          flavor: |
            latest=${{ github.event.action == 'released' }}
          labels: |
            org.opencontainers.image.title=Open Dungeon Master
            org.opencontainers.image.description=Self-hosted multiplayer D&D 5e platform with an AI Dungeon Master

      - name: Promote the beta's image
        if: ${{ steps.channel.outputs.mode == 'retag' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
          IMAGES: ${{ steps.registries.outputs.images }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          VERSION="${TAG#v}"
          # Each registry's new tags point at that registry's own copy of the
          # beta image: a new manifest list, no layers pushed.
          while read -r image; do
            args=()
            while read -r ref; do
              case "$ref" in "$image:"*) args+=(-t "$ref") ;; esac
            done <<< "$TAGS"
            echo "$image:$VERSION -> ${args[*]}"
            docker buildx imagetools create "${args[@]}" "$image:$VERSION"
          done <<< "$IMAGES"

      - name: Describe the build
        if: ${{ steps.channel.outputs.mode == 'build' }}
        id: build
        run: |
          # `git describe` in the shape the app reads: a release tag is that
          # tag with nothing on top; anything else is the bare commit.
          short="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "describe=${GITHUB_REF_NAME}-0-g${short}" >> "$GITHUB_OUTPUT"
          else
            echo "describe=${short}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: ${{ steps.channel.outputs.mode == 'build' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: the app is meant to sit beside an x86 GPU host, and a
          # QEMU build of the Next.js app would take most of the hour. An arm64
          # host builds its own image from a clone (docker compose up -d
          # --build); next.config.ts and the Dockerfile keep that host's
          # onnxruntime binding, so embeddings work there too (issue #39).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build context has no .git: the About dialog is told which
          # commit the image was made from (next.config.ts).
          build-args: |
            ODM_BUILD_COMMIT=${{ github.sha }}
            ODM_BUILD_DESCRIBE=${{ steps.build.outputs.describe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          tag=$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -1)
          echo "Pulling and starting $tag"
          docker run -d --name odm-smoke -p 3005:3005 "$tag"
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3005/api/health > /dev/null; then
              echo "Published image answers /api/health."
              docker rm -f odm-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Published image never became healthy."
          docker logs odm-smoke
          docker rm -f odm-smoke
          exit 1
