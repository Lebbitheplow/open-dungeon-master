name: Windows smoke

# Catches Windows-specific breakage in the install, lint and build path.
# The Python setup, the setup-windows.ps1 validation and the two check:image-*
# steps were dropped: none of those scripts exist any more, so every run since
# the fork has failed on them.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its run still going; every commit
# on main keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: windows build
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # One payload built on Linux ships to every desktop platform, so the
      # compiled server has to keep its Windows branches wherever it is built.
      - name: The built server keeps its Windows code
        run: node scripts/check-built-platform.mjs

  # The suite took 30 of its 45 minutes in one job by 0.30.0; the runners
  # share its files instead (they run one at a time, vitest.config.mts).
  tests:
    name: windows tests (${{ matrix.shard }}/3)
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Tests
        run: npm test -- --shard=${{ matrix.shard }}/3
