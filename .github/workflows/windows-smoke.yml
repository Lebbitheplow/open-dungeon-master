name: Windows smoke

# Catches Windows-specific breakage in the install, lint and build path.
# The Python setup, the setup-windows.ps1 validation and the two check:image-*
# steps were dropped: none of those scripts exist any more, so every run since
# the fork has failed on them.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-smoke:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
