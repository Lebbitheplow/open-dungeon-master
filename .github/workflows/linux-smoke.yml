name: Linux smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its run still going; every commit
# on main keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One job doing all of this took 60 minutes by 0.30.0 (213 scenario runs,
# 770-odd test files one at a time): the work is split across runners
# instead, each a few minutes plus its own install and build.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # A route's first-load JS and CSS against scripts/bundle-budget.json.
      - name: First-load size budgets
        run: node scripts/check-bundle-budget.mjs

      # One payload built on Linux ships to every desktop platform, so the
      # compiled server has to keep its Windows branches wherever it is built.
      - name: The built server keeps its Windows code
        run: node scripts/check-built-platform.mjs

  # Each runner takes a share of the files and runs them a few at a time
  # (vitest.config.mts), each file in its own process.
  tests:
    name: tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test -- --shard=${{ matrix.shard }}/3

  # The built server in a real Chromium: dialogs, scrolls, polls and
  # preferences that no static render can exercise (scripts/browser). Each
  # runner builds, seeds and serves its own share of the scenarios.
  browser:
    name: browser (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Browser scenarios
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:browser -- --shard ${{ matrix.shard }}/6
