name: Linux smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Lint, the unit suite (700-odd files), the build and 126 browser
    # scenarios on desktop and phone: a passing run takes about 50 minutes
    # on a hosted runner, and the 45-minute limit cut 0.28.3's run off in
    # the middle of the scenarios with everything before them green.
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The built server in a real Chromium: dialogs, scrolls, polls and
      # preferences that no static render can exercise (scripts/browser).
      - name: Browser scenarios
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:browser

      # A route's first-load JS and CSS against scripts/bundle-budget.json.
      - name: First-load size budgets
        run: node scripts/check-bundle-budget.mjs

      # One payload built on Linux ships to every desktop platform, so the
      # compiled server has to keep its Windows branches wherever it is built.
      - name: The built server keeps its Windows code
        run: node scripts/check-built-platform.mjs
