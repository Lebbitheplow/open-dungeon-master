name: Bug report
description: Something went wrong while you played or ran the server.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. Only **What happened** and **Your setup** are required, so a short report is fine.

        If you can, save a report file first: at the table, open **Report a problem** (the table menu on a phone), or go to **Admin > Server log > Report a problem**. The file is saved to your device and never sent anywhere. Drag it into the last box below. Open the file first if you want to see what it holds.

        New to testing? [docs/testing.md](https://github.com/Lebbitheplow/open-dungeon-master/blob/main/docs/testing.md) explains how.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you were doing just before. Paste any error message you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, if you know them. "It happened once" is a useful answer too.
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: The report file holds most of this. Fill in what you know; "not sure" is fine.
      value: |
        - Version (your account menu > About):
        - Operating system:
        - Install kind (desktop app, Android app, Docker, from source):
        - Narrator backend and model (for example Ollama with qwen3, OpenAI with gpt-5, Claude Code):
        - DM mode (AI Dungeon Master, AI narrates and a person steers, a person runs the game, a person runs it with AI help):
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Report file and screenshots
      description: Drag the saved report file (odm-report-....json) here, with any screenshots. GitHub cannot attach the file for you, so this one step is by hand. In an app, paste its diagnostics summary (Settings > Troubleshooting) here too.
      placeholder: Drag the report file here.
