name: Bug report
description: Something in Open Game Master itself is broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for bugs in Open Game Master itself. Questions about installing it, choosing a model or setting up a backend go to [Q&A in Discussions](https://github.com/Lebbitheplow/open-dungeon-master/discussions/categories/q-a) or [Discord](https://discord.gg/B2tQFr3TYD), where other players can help.

        **Playing on someone else's server?** Tell whoever runs it first. Most problems come from how a server is set up, and they can check that.

        **Running the server yourself?** Start from **Report a problem** in the table's Help, or **Admin > Server log > Report a problem**. It lists what to check first (an unsupported model, a backend that does not answer), saves a report file to your device, and opens this form with Your setup filled in. Drag the file into the last box below. Open it first if you want to see what it holds.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I am on the latest release (your account menu > About says whether a newer one is out).
          required: true
        - label: I searched the open and closed issues, and this is not one of them.
          required: true
        - label: If the narrator is a local model, the machine has at least 16 GB of graphics memory, the minimum in the README. Below that, a small model's mistakes are not bugs.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you were doing just before. Paste any error message you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps from opening the page. If it happened once and you cannot make it happen again, say exactly what you were doing.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Report a problem fills this in for you, with anything below the supported minimum. Otherwise, fill in what you know.
      value: |
        - Version (your account menu > About):
        - Operating system:
        - Install kind (desktop app, Android app, Docker, from source):
        - Narrator backend and model (for example llama.cpp with gpt-oss-20b, OpenAI with gpt-5, Claude Code):
        - Graphics memory, if the narrator is a local model:
        - DM mode (AI Dungeon Master, AI narrates and a person steers, a person runs the game, a person runs it with AI help):
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Report file and screenshots
      description: Drag the saved report file (odm-report-....json) here, with any screenshots. GitHub cannot attach the file for you, so this one step is by hand. In an app, paste its diagnostics summary (Settings > Troubleshooting) here too.
      placeholder: Drag the report file here.
