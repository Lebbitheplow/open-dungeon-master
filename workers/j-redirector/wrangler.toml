# The /j invite redirector: a Cloudflare Worker on the free tier, no server.
#
# Deploy (one time setup, then one command):
#   npx wrangler login
#   cd workers/j-redirector && npx wrangler deploy
#
# The route below binds it to opendungeonmaster.com/j* once the zone's DNS
# is proxied through Cloudflare. Nothing else in the zone is touched.

name = "odm-j-redirector"
main = "src/index.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "opendungeonmaster.com/j*", zone_name = "opendungeonmaster.com" },
  # Android App Link verification for the client's https /j intent-filter.
  { pattern = "opendungeonmaster.com/.well-known/assetlinks.json", zone_name = "opendungeonmaster.com" },
]

[vars]
# SHA-256 fingerprints of APK signing certificates allowed to handle /j App
# Links, comma-separated. Debug keystore on the dev machine first, then the
# GitHub release keystore (~/.local/share/odm), then the Play App Signing
# certificate Google re-signs Play installs with.
ANDROID_CERT_SHA256 = "01:3E:49:6C:EF:07:9D:E4:22:44:A2:55:60:03:DF:20:42:FD:76:AF:BD:27:04:BB:22:25:59:2D:FF:77:92:73,94:39:9C:B4:28:E3:CF:6B:11:D0:60:16:24:11:02:FF:8C:24:A2:1E:13:03:58:E2:29:48:52:B9:EC:F0:99:15,5A:87:85:A3:00:87:03:79:22:FE:1B:F0:50:F6:86:AC:B9:F7:21:29:FC:E1:6F:6F:32:01:75:C3:65:9E:FD:B5"
